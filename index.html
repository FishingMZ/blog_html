<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Fishing's Blog - 用文字记录思考，以代码构建世界" />
    <meta name="author" content="Fishing" />
    <meta name="theme-color" content="#3b6ea5" />
    <title>Fishing's Blog</title>

    <link rel="icon" href="assets/icons/favicon.ico" />
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css"
    media="screen" />
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css"
    media="screen and (prefers-color-scheme: dark)" />
    <link rel="preload" href="assets/fonts/font.ttf" as="font" type="font/ttf" crossorigin />

    <style>
        @font-face {
            font-family: 'BlueArchive';
            src: url('assets/fonts/font.ttf') format('truetype');
            font-display: swap;
        }

        :root {
            --primary: #3b6ea5;
            --primary-light: #5a8cc9;
            --primary-dark: #2a4f7a;
            --bg: #f6f9fc;
            --card-bg: #ffffff;
            --card-bg-rgb: 255, 255, 255;
            --text: #1e2a3a;
            --text-secondary: #4a5a6e;
            --text-muted: #8a9aa8;
            --border: #e2e8f0;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            --shadow-hover: 0 8px 30px rgba(0, 0, 0, 0.10);
            --radius: 14px;
            --radius-sm: 8px;
            --transition: 0.25s ease;
            --font: 'BlueArchive', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                "Helvetica Neue", Arial, "Noto Sans SC", sans-serif;
            --max-width: 820px;
            --header-height: 64px;
            --tag-bg: #eef3f8;
            --tag-hover: #dce6f0;
            --progress-bg: #dce6f0;
            --code-bg: #f4f6f9;

            /* 背景控制 */
            --bg-opacity: 0.5;
            --bg-blur: 6px;
            /* 界面组件控制 */
            --ui-opacity: 1;
            --ui-blur: 0px;
        }

        [data-theme="dark"] {
            --bg: #0f1724;
            --card-bg: #1a2538;
            --card-bg-rgb: 26, 37, 56;
            --text: #e8edf4;
            --text-secondary: #b0c0d4;
            --text-muted: #6a7e96;
            --border: #2a3a50;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            --shadow-hover: 0 8px 30px rgba(0, 0, 0, 0.5);
            --tag-bg: #1e2d42;
            --tag-hover: #2a3d58;
            --progress-bg: #2a3a50;
            --code-bg: #1a2538;
        }

        @media (min-width: 1200px) { :root { --max-width: 1024px; } }
        @media (min-width: 1600px) { :root { --max-width: 1200px; } }

        @media (prefers-reduced-motion: reduce) {
            :root { --transition: 0s; }
            html { scroll-behavior: auto; }
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        *,
        *::before,
        *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; scroll-padding-top: var(--header-height); }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            line-height: 1.7;
            transition: background var(--transition), color var(--transition);
            padding-top: var(--header-height);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            position: relative;
        }
        a { color: var(--primary); text-decoration: none; transition: color var(--transition); }
        a:hover { color: var(--primary-dark); }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--primary-light); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary); }

        /* 背景层 */
        #bg-layer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2;
            background-size: cover; background-position: center; background-repeat: no-repeat;
            opacity: var(--bg-opacity); filter: blur(var(--bg-blur));
            transition: opacity 0.3s ease, filter 0.3s ease; pointer-events: none;
        }

        /* 头部 */
        .header {
            position: fixed; top: 0; left: 0; right: 0; height: var(--header-height);
            background-color: rgba(var(--card-bg-rgb), 0.85);
            backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
            border-bottom: 1px solid var(--border); z-index: 100;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 28px;
            transition: background var(--transition), border var(--transition), box-shadow var(--transition);
        }
        .header.scrolled { box-shadow: 0 2px 16px rgba(0,0,0,0.08); }
        [data-theme="dark"] .header.scrolled { box-shadow: 0 2px 16px rgba(0,0,0,0.3); }

        .header-brand {
            display: flex; align-items: center; gap: 10px;
            font-weight: 700; font-size: 1.25rem; color: var(--text);
            letter-spacing: -0.3px; cursor: pointer; user-select: none;
        }
        .header-brand:hover { opacity: 0.8; }
        .header-brand .logo {
            display: inline-flex; align-items: center; justify-content: center;
            width: 34px; height: 34px; background: var(--primary); color: #fff;
            border-radius: var(--radius-sm); font-size: 1.1rem; font-weight: 600; flex-shrink: 0;
        }
        .header-brand span { color: var(--text-secondary); font-weight: 400; font-size: 0.9rem; }

        .header-actions { display: flex; align-items: center; gap: 14px; }
        .header-back {
            display: none; align-items: center; gap: 6px; font-size: 0.95rem;
            color: var(--text-secondary); background: rgba(var(--card-bg-rgb), 0.4);
            border: 1px solid var(--border); border-radius: 20px; padding: 6px 14px;
            cursor: pointer; transition: all var(--transition); font-family: inherit; white-space: nowrap;
        }
        .header-back.visible { display: inline-flex; }
        .header-back:hover { border-color: var(--primary); color: var(--primary); }

        .menu-btn {
            background: rgba(var(--card-bg-rgb), 0.4); border: 1px solid var(--border);
            border-radius: 50%; width: 38px; height: 38px; font-size: 1.2rem;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            color: var(--text-secondary); transition: all var(--transition); flex-shrink: 0;
        }
        .menu-btn:hover { border-color: var(--primary); color: var(--primary); }

        /* 菜单面板 */
        .menu-panel {
            position: fixed; top: var(--header-height); right: 20px;
            width: 320px; max-width: calc(100vw - 40px);
            background: rgba(var(--card-bg-rgb), 0.85); backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px); border: 1px solid var(--border);
            border-radius: var(--radius); box-shadow: var(--shadow-hover);
            padding: 20px; z-index: 99;
            opacity: 0; visibility: hidden; transform: translateY(-10px);
            transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s;
        }
        .menu-panel.open { opacity: 1; visibility: visible; transform: translateY(0); }

        .menu-section { margin-bottom: 20px; }
        .menu-section:last-child { margin-bottom: 0; }
        .menu-section-title {
            font-size: 0.8rem; font-weight: 600; color: var(--text-muted);
            margin-bottom: 10px; letter-spacing: 0.4px; text-transform: uppercase;
        }
        .menu-row {
            display: flex; align-items: center; justify-content: space-between;
            gap: 10px; margin-bottom: 12px;
        }
        .menu-row:last-child { margin-bottom: 0; }
        .menu-btn-action {
            background: rgba(var(--card-bg-rgb), 0.6); backdrop-filter: blur(4px);
            border: 1px solid var(--border); border-radius: 20px; padding: 6px 16px;
            font-size: 0.85rem; cursor: pointer; transition: all var(--transition);
            color: var(--text-secondary); font-family: inherit;
            white-space: nowrap; display: inline-flex; align-items: center; gap: 6px;
        }
        .menu-btn-action:hover { background: var(--tag-hover); border-color: var(--primary-light); color: var(--text); }
        .file-upload-label { cursor: pointer; }
        #customBgInput { display: none; }
        .menu-divider { border-top: 1px solid var(--border); margin: 14px 0; }

        input[type="range"] { width: 100%; cursor: pointer; accent-color: var(--primary); }
        .slider-value { font-size: 0.8rem; color: var(--text-muted); min-width: 35px; text-align: right; }

        /* 界面组件半透明 (独立变量) */
        .post-card, .tag-btn, .layout-btn, .menu-panel, .post-detail {
            background-color: rgba(var(--card-bg-rgb), var(--ui-opacity));
            backdrop-filter: blur(calc(var(--ui-blur) * 1px));
            -webkit-backdrop-filter: blur(calc(var(--ui-blur) * 1px));
        }
        .post-card, .tag-btn, .layout-btn, .post-detail { border: 1px solid var(--border); }
        .post-card .meta .post-tag { background: rgba(var(--card-bg-rgb), 0.6); backdrop-filter: blur(2px); }

        .reading-progress {
            position: fixed; top: var(--header-height); left: 0; height: 3px;
            background: var(--primary); z-index: 101; width: 0%;
            transition: width 0.15s linear; border-radius: 0 2px 2px 0; pointer-events: none;
        }

        .container { max-width: var(--max-width); margin: 0 auto; padding: 30px 24px 60px; }

        .page-home .home-header { margin-bottom: 16px; }
        .page-home .home-header h1 { font-size: 2.2rem; font-weight: 700; letter-spacing: -0.5px; }
        .page-home .home-header p { color: var(--text-secondary); font-size: 1.05rem; margin-top: 4px; }

        .tag-filter {
            display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px;
            padding: 14px 0 18px; border-bottom: 1px solid var(--border); margin-bottom: 24px;
        }
        .tag-filter .tag-label { font-size: 0.85rem; font-weight: 600; color: var(--text-muted); margin-right: 6px; }
        .tag-btn {
            display: inline-flex; align-items: center; gap: 4px; padding: 5px 16px;
            border-radius: 20px; font-size: 0.85rem; font-weight: 500; cursor: pointer;
            transition: all var(--transition); font-family: inherit; user-select: none;
        }
        .tag-btn.active { background: var(--primary); border-color: var(--primary); color: #fff; }
        .tag-btn .count { font-size: 0.7rem; opacity: 0.7; margin-left: 2px; }

        .layout-toggle {
            display: flex; align-items: center; gap: 6px; margin-left: auto;
            padding-left: 12px; border-left: 1px solid var(--border);
        }
        .layout-toggle .layout-label { font-size: 0.75rem; color: var(--text-muted); }
        .layout-btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
            padding: 4px 16px; border-radius: 20px; font-size: 0.8rem; font-weight: 500;
            cursor: pointer; transition: all var(--transition); font-family: inherit; min-height: 32px;
        }
        .layout-btn .icon-view { display: inline-block; font-size: 1rem; line-height: 1; }

        .post-list { display: flex; flex-direction: column; gap: 20px; }
        .post-list.grid-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
        .post-list.grid-layout .post-card { padding: 18px 20px; border-radius: var(--radius-sm); }
        .post-list:not(.grid-layout) .post-card { padding: 24px 28px; }
        .post-card {
            border-radius: var(--radius); box-shadow: var(--shadow); transition: all var(--transition);
            cursor: pointer; position: relative; overflow: hidden;
        }
        .post-card:hover { box-shadow: var(--shadow-hover); transform: translateY(-2px); }
        .post-card .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; font-size: 0.82rem; color: var(--text-muted); margin-bottom: 8px; }
        .post-card h2 { font-weight: 600; letter-spacing: -0.3px; margin-bottom: 6px; }
        .post-card .summary { color: var(--text-secondary); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .post-card .read-more { display: inline-block; margin-top: 12px; font-weight: 500; color: var(--primary); }

        .empty-state, .loading-state, .error-state { text-align: center; padding: 50px 20px; color: var(--text-muted); }
        .loading-state .spinner {
            display: inline-block; width: 36px; height: 36px; border: 3px solid var(--border);
            border-top-color: var(--primary); border-radius: 50%; animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .page-post .post-detail { border-radius: var(--radius); padding: 40px 44px; box-shadow: var(--shadow); }
        .post-detail .post-title { font-size: 2rem; font-weight: 700; margin-bottom: 8px; }
        .post-content { font-size: 1.05rem; line-height: 1.85; }
        .post-content pre {
            background: var(--code-bg); border-radius: var(--radius-sm); padding: 16px 20px;
            overflow-x: auto; margin: 1.2em 0; border: 1px solid var(--border);
        }
        .post-content code { font-family: monospace; font-size: 0.9em; background: var(--code-bg); padding: 0.2em 0.5em; border-radius: 4px; }

        .back-to-top {
            position: fixed; bottom: 32px; right: 32px; width: 44px; height: 44px;
            border-radius: 50%; background: rgba(var(--card-bg-rgb), 0.6); backdrop-filter: blur(4px);
            border: 1px solid var(--border); box-shadow: var(--shadow); color: var(--text-secondary);
            font-size: 1.3rem; cursor: pointer; display: flex; align-items: center; justify-content: center;
            z-index: 90; opacity: 0; transform: translateY(20px); pointer-events: none; transition: all var(--transition);
        }
        .back-to-top.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }

        .footer { max-width: var(--max-width); margin: 40px auto 0; padding: 20px 24px 40px; text-align: center; color: var(--text-muted); font-size: 0.85rem; border-top: 1px solid var(--border); }

        @media (max-width: 768px) { .post-list.grid-layout { grid-template-columns: 1fr; } .layout-toggle { display: none; } }
        @media (max-width: 640px) { :root { --header-height: 58px; } .header { padding: 0 16px; } .header-brand span { display: none; } }

        .hidden { display: none !important; }
        .fade-in { animation: fadeIn 0.35s ease both; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div id="bg-layer"></div>

    <header class="header" id="header">
        <div class="header-brand" id="headerBrand" title="返回首页" role="button" tabindex="0">
            <span class="logo" aria-hidden="true">🐟</span> Fishing's Blog <span>· Html</span>
        </div>
        <div class="header-actions">
            <button class="header-back" id="backBtn">← 返回</button>
            <button class="menu-btn" id="menuBtn" aria-label="设置">☰</button>
        </div>
    </header>

    <div class="menu-panel" id="menuPanel">
        <div class="menu-section">
            <div class="menu-row" style="margin-bottom:0;">
                <span class="menu-section-title" style="margin-bottom:0;">主题</span>
                <button class="menu-btn-action" id="themeToggleMenu">深色模式</button>
            </div>
        </div>
        <div class="menu-divider"></div>
        <div class="menu-section">
            <div class="menu-section-title">背景图片</div>
            <div class="menu-row">
                <button class="menu-btn-action" id="bgNoneBtn">无背景</button>
                <button class="menu-btn-action" id="bgRandomBtn">随机背景</button>
            </div>
            <div class="menu-row">
                <label class="menu-btn-action file-upload-label" for="customBgInput">上传图片</label>
                <input type="file" id="customBgInput" accept="image/*">
                <button class="menu-btn-action" id="bgDownloadBtn">下载</button>
            </div>
        </div>
        <div class="menu-divider"></div>
        <div class="menu-section">
            <div class="menu-section-title">背景调整</div>
            <div class="menu-row">
                <span>透明度</span>
                <input type="range" id="bgOpacitySlider" min="0" max="1" step="0.05" value="0.5">
                <span class="slider-value" id="opacityValue">0.5</span>
            </div>
            <div class="menu-row">
                <span>模糊度</span>
                <input type="range" id="bgBlurSlider" min="0" max="20" step="1" value="6">
                <span class="slider-value" id="blurValue">6px</span>
            </div>
        </div>
        <div class="menu-divider"></div>
        <div class="menu-section">
            <div class="menu-section-title">界面组件</div>
            <div class="menu-row">
                <span>透明度</span>
                <input type="range" id="uiOpacitySlider" min="0.1" max="1" step="0.05" value="1">
                <span class="slider-value" id="uiOpacityValue">1</span>
            </div>
            <div class="menu-row">
                <span>模糊度</span>
                <input type="range" id="uiBlurSlider" min="0" max="20" step="1" value="0">
                <span class="slider-value" id="uiBlurValue">0px</span>
            </div>
        </div>
    </div>

    <div class="reading-progress" id="readingProgress" aria-hidden="true"></div>
    <button class="back-to-top" id="backToTop" aria-label="回到顶部">↑</button>

    <main class="container" id="app">
        <div id="pageHome" class="page-home">
            <div class="home-header"><h1>📖 所有文章</h1><p>用文字记录思考，以代码构建世界</p></div>
            <nav id="tagFilter" class="tag-filter"></nav>
            <div id="postList" class="post-list">
                <div class="loading-state"><div class="spinner"></div><p>加载文章列表...</p></div>
            </div>
        </div>
        <div id="pagePost" class="page-post hidden">
            <article id="postDetail" class="post-detail">
                <div class="loading-state"><div class="spinner"></div><p>加载文章内容...</p></div>
            </article>
        </div>
    </main>

    <footer class="footer">&copy; <span id="currentYear">2026</span> <a href="#">Fishing's Blog</a> · 由 Marked + Highlight.js 驱动</footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/11.1.1/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script>
    (function() {
        'use strict';

        const CONFIG = {
            indexUrl: 'index.json',
            postsDir: 'posts/',
            fetchTimeout: 10000,
            scrollThreshold: 350,
            randomBgApi: 'https://img.catcdn.cn/ba/'
        };

        const $ = (sel) => document.querySelector(sel);
        const pageHome = $('#pageHome'), pagePost = $('#pagePost'), tagFilter = $('#tagFilter'),
              postList = $('#postList'), postDetail = $('#postDetail'), backBtn = $('#backBtn'),
              headerBrand = $('#headerBrand'), header = $('#header'), readingProgress = $('#readingProgress'),
              backToTop = $('#backToTop'), currentYearSpan = $('#currentYear'),
              menuBtn = $('#menuBtn'), menuPanel = $('#menuPanel'), bgLayer = $('#bg-layer'),
              themeToggleMenu = $('#themeToggleMenu'), bgNoneBtn = $('#bgNoneBtn'), bgRandomBtn = $('#bgRandomBtn'),
              customBgInput = $('#customBgInput'), bgDownloadBtn = $('#bgDownloadBtn'),
              bgOpacitySlider = $('#bgOpacitySlider'), bgBlurSlider = $('#bgBlurSlider'),
              uiOpacitySlider = $('#uiOpacitySlider'), uiBlurSlider = $('#uiBlurSlider'),
              opacityValue = $('#opacityValue'), blurValue = $('#blurValue'),
              uiOpacityValue = $('#uiOpacityValue'), uiBlurValue = $('#uiBlurValue');

        let posts = [], currentTag = 'all', currentPostId = null, isLoading = false, currentLayout = 'single';
        const markdownCache = new Map();
        if (currentYearSpan) currentYearSpan.textContent = new Date().getFullYear();

        if (typeof marked !== 'undefined') {
            marked.setOptions({ breaks: true, gfm: true });
            marked.setOptions({ highlight: (code, lang) => {
                if (typeof hljs !== 'undefined' && lang && hljs.getLanguage(lang)) {
                    try { return hljs.highlight(code, { language: lang }).value; } catch (e) {}
                }
                return code.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'})[m]);
            }});
        }

        function fetchWithTimeout(url, timeout = CONFIG.fetchTimeout) {
            const ctrl = new AbortController();
            setTimeout(() => ctrl.abort(), timeout);
            return fetch(url, { signal: ctrl.signal });
        }

        function formatDate(d) {
            if(!d) return '未知日期';
            try {
                const t = new Date(d);
                if(isNaN(t.getTime())) { const p = Date.parse(d); if(isNaN(p)) return d; const f = new Date(p); return `${f.getFullYear()}年${String(f.getMonth()+1).padStart(2,'0')}月${String(f.getDate()).padStart(2,'0')}日`; }
                return `${t.getFullYear()}年${String(t.getMonth()+1).padStart(2,'0')}月${String(t.getDate()).padStart(2,'0')}日`;
            } catch { return d; }
        }

        function escapeHtml(s) { if(!s) return ''; const m={'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}; return String(s).replace(/[&<>"']/g,c=>m[c]); }
        function debounce(fn, delay=200) { let t; return function(...a){ clearTimeout(t); t=setTimeout(()=>fn.apply(this,a),delay); } }

        // 主题
        function getPreferredTheme() {
            const stored = localStorage.getItem('blog-theme');
            if (stored) return stored;
            return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        function setTheme(theme) {
            const isDark = theme === 'dark';
            document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
            themeToggleMenu.textContent = isDark ? '浅色模式' : '深色模式';
            localStorage.setItem('blog-theme', theme);
        }
        setTheme(getPreferredTheme());
        themeToggleMenu.addEventListener('click', () => {
            const cur = document.documentElement.getAttribute('data-theme') || 'light';
            setTheme(cur === 'dark' ? 'light' : 'dark');
        });
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
            if (!localStorage.getItem('blog-theme')) setTheme(e.matches ? 'dark' : 'light');
        });

        // 背景与界面组件设置
        function getSettings() {
            const defaults = {
                type: 'random', customData: '',
                bgOpacity: 0.5, bgBlur: 6,
                uiOpacity: 1, uiBlur: 0
            };
            try { return { ...defaults, ...JSON.parse(localStorage.getItem('bg-settings')) }; } catch { return defaults; }
        }
        function saveSettings(s) { localStorage.setItem('bg-settings', JSON.stringify(s)); }

        function applySettings() {
            const s = getSettings();
            document.documentElement.style.setProperty('--bg-opacity', s.bgOpacity);
            document.documentElement.style.setProperty('--bg-blur', s.bgBlur + 'px');
            document.documentElement.style.setProperty('--ui-opacity', s.uiOpacity);
            document.documentElement.style.setProperty('--ui-blur', s.uiBlur + 'px');

            bgOpacitySlider.value = s.bgOpacity; blurValue.textContent = s.bgBlur + 'px';
            bgBlurSlider.value = s.bgBlur; opacityValue.textContent = s.bgOpacity;
            uiOpacitySlider.value = s.uiOpacity; uiOpacityValue.textContent = s.uiOpacity;
            uiBlurSlider.value = s.uiBlur; uiBlurValue.textContent = s.uiBlur + 'px';

            if (s.type === 'none') { bgLayer.style.backgroundImage = 'none'; bgDownloadBtn.disabled = true; }
            else if (s.type === 'random') { bgLayer.style.backgroundImage = `url(${CONFIG.randomBgApi}?t=${Date.now()})`; bgDownloadBtn.disabled = false; }
            else if (s.type === 'custom' && s.customData) { bgLayer.style.backgroundImage = `url(${s.customData})`; bgDownloadBtn.disabled = false; }
            else { bgLayer.style.backgroundImage = 'none'; bgDownloadBtn.disabled = true; }
        }

        function setBgNone() { const s = getSettings(); s.type = 'none'; s.customData = ''; saveSettings(s); applySettings(); }
        function setBgRandom() { const s = getSettings(); s.type = 'random'; s.customData = ''; saveSettings(s); applySettings(); }
        function setBgCustom(dataUrl) { const s = getSettings(); s.type = 'custom'; s.customData = dataUrl; saveSettings(s); applySettings(); }

        async function downloadCurrentBg() {
            const s = getSettings();
            let url = '';
            if (s.type === 'random') url = bgLayer.style.backgroundImage.replace(/url\(["']?/, '').replace(/["']?\)/, '');
            else if (s.type === 'custom') url = s.customData;
            if (!url) return;
            try {
                const img = new Image(); img.crossOrigin = 'anonymous'; img.src = url;
                await new Promise((resolve, reject) => { img.onload = resolve; img.onerror = reject; });
                const canvas = document.createElement('canvas'); canvas.width = img.naturalWidth; canvas.height = img.naturalHeight;
                const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0);
                canvas.toBlob(blob => {
                    const blobUrl = URL.createObjectURL(blob);
                    const a = document.createElement('a'); a.href = blobUrl; a.download = 'background-' + Date.now() + '.jpg';
                    document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(blobUrl);
                }, 'image/jpeg', 0.95);
            } catch (e) { alert('下载失败，请尝试右键保存图片。'); }
        }

        bgNoneBtn.addEventListener('click', setBgNone);
        bgRandomBtn.addEventListener('click', setBgRandom);
        customBgInput.addEventListener('change', e => {
            const file = e.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = ev => setBgCustom(ev.target.result);
            reader.readAsDataURL(file);
        });
        bgDownloadBtn.addEventListener('click', downloadCurrentBg);

        bgOpacitySlider.addEventListener('input', function() {
            const val = parseFloat(this.value);
            document.documentElement.style.setProperty('--bg-opacity', val);
            opacityValue.textContent = val;
            const s = getSettings(); s.bgOpacity = val; saveSettings(s);
        });
        bgBlurSlider.addEventListener('input', function() {
            const val = parseInt(this.value, 10);
            document.documentElement.style.setProperty('--bg-blur', val + 'px');
            blurValue.textContent = val + 'px';
            const s = getSettings(); s.bgBlur = val; saveSettings(s);
        });
        uiOpacitySlider.addEventListener('input', function() {
            const val = parseFloat(this.value);
            document.documentElement.style.setProperty('--ui-opacity', val);
            uiOpacityValue.textContent = val;
            const s = getSettings(); s.uiOpacity = val; saveSettings(s);
        });
        uiBlurSlider.addEventListener('input', function() {
            const val = parseInt(this.value, 10);
            document.documentElement.style.setProperty('--ui-blur', val + 'px');
            uiBlurValue.textContent = val + 'px';
            const s = getSettings(); s.uiBlur = val; saveSettings(s);
        });

        // 初始加载设置
        if (!localStorage.getItem('bg-settings')) {
            // 首次打开：随机背景，透明度0.5，模糊6，组件透明度1，模糊0
            saveSettings({ type: 'random', customData: '', bgOpacity: 0.5, bgBlur: 6, uiOpacity: 1, uiBlur: 0 });
        }
        applySettings();

        // 菜单
        function toggleMenu(force) {
            const isOpen = menuPanel.classList.contains('open');
            const newState = typeof force === 'boolean' ? force : !isOpen;
            menuPanel.classList.toggle('open', newState);
            menuBtn.setAttribute('aria-expanded', newState);
        }
        menuBtn.addEventListener('click', e => { e.stopPropagation(); toggleMenu(); });
        document.addEventListener('click', e => { if (!menuPanel.contains(e.target) && e.target !== menuBtn) toggleMenu(false); });
        document.addEventListener('keydown', e => { if (e.key === 'Escape' && menuPanel.classList.contains('open')) { toggleMenu(false); menuBtn.focus(); } });

        // 布局
        function getPreferredLayout() { const s = localStorage.getItem('blog-layout'); if (s) return s; return window.innerWidth >= 768 ? 'double' : 'single'; }
        function setLayout(layout) { currentLayout = layout; localStorage.setItem('blog-layout', layout); postList.classList.toggle('grid-layout', layout === 'double'); updateLayoutButton(); }
        function toggleLayout() { setLayout(currentLayout === 'single' ? 'double' : 'single'); }
        function updateLayoutButton() {
            const btn = document.querySelector('.layout-btn'); if (!btn) return;
            const icon = btn.querySelector('.icon-view'), status = btn.querySelector('.layout-status');
            if (currentLayout === 'single') { if(icon) icon.textContent='▦'; if(status) status.textContent='单列'; }
            else { if(icon) icon.textContent='▦▦'; if(status) status.textContent='双列'; }
        }
        function renderLayoutToggle() {
            let toggle = tagFilter.querySelector('.layout-toggle');
            if (toggle) { updateLayoutButton(); return; }
            toggle = document.createElement('div'); toggle.className = 'layout-toggle';
            toggle.innerHTML = '<span class="layout-label">📐 布局</span>';
            const btn = document.createElement('button'); btn.className = 'layout-btn';
            btn.innerHTML = '<span class="icon-view"></span><span class="layout-status"></span>';
            btn.addEventListener('click', toggleLayout);
            toggle.appendChild(btn); tagFilter.appendChild(toggle);
            updateLayoutButton();
        }

        // 路由和文章加载 (保留核心逻辑)
        function getPostIdFromHash() { const h=window.location.hash.slice(1); return h.startsWith('post/')?h.slice(5):null; }
        function getTagFromHash() { const h=window.location.hash.slice(1); return h.startsWith('tag/')?decodeURIComponent(h.slice(4)):null; }
        function setHashForTag(tag) { if(tag&&tag!=='all') window.location.hash='tag/'+encodeURIComponent(tag); else history.replaceState(null,'',location.pathname); }
        function setHashForPost(id) { if(id) window.location.hash='post/'+id; else history.replaceState(null,'',location.pathname); }
        function getAllTags(arr) { const m=new Map(); arr.forEach(p=>{ if(p.tags) p.tags.forEach(t=>{ const k=String(t).trim(); if(k) m.set(k,(m.get(k)||0)+1); }); }); return Array.from(m.entries()).sort((a,b)=>a[0].localeCompare(b[0],'zh-Hans-CN')).map(([n,c])=>({name:n,count:c})); }
        function getFilteredPosts(tag) { if(!tag||tag==='all') return [...posts]; return posts.filter(p=>p.tags&&p.tags.some(t=>String(t).trim()===tag)); }

        async function loadIndex() {
            try {
                const r = await fetchWithTimeout(CONFIG.indexUrl);
                if (!r.ok) throw new Error(`HTTP ${r.status}`);
                const d = await r.json(); if (!Array.isArray(d)) throw new Error('格式错误');
                posts = d.filter(i => i.id && i.title && i.filename);
            } catch(e) { console.error(e); posts = []; postList.innerHTML = `<div class="error-state">📂 索引加载失败</div>`; throw e; }
        }

        function renderTags(activeTag) {
            const toggle = tagFilter.querySelector('.layout-toggle');
            tagFilter.innerHTML = '';
            const allTags = getAllTags(posts);
            let html = `<span class="tag-label">🏷️ 分类</span><button class="tag-btn ${activeTag==='all'?'active':''}" data-tag="all">全部 <span class="count">(${posts.length})</span></button>`;
            allTags.forEach(t => html += `<button class="tag-btn ${activeTag===t.name?'active':''}" data-tag="${escapeHtml(t.name)}">${escapeHtml(t.name)} <span class="count">(${t.count})</span></button>`);
            tagFilter.innerHTML = html;
            if (toggle) { tagFilter.appendChild(toggle); updateLayoutButton(); } else renderLayoutToggle();
            tagFilter.querySelectorAll('.tag-btn').forEach(b => b.addEventListener('click', function() { selectTag(this.dataset.tag); }));
        }

        function renderPostList(tag) {
            const filtered = getFilteredPosts(tag);
            if (!filtered.length) { postList.innerHTML = `<div class="empty-state">🔍 无文章</div>`; return; }
            const sorted = [...filtered].sort((a,b)=>new Date(b.date)-new Date(a.date));
            postList.innerHTML = sorted.map(p => `
                <article class="post-card fade-in" data-id="${p.id}">
                    <div class="meta"><span>📅 ${formatDate(p.date)}</span>${p.tags?p.tags.map(t=>`<span class="post-tag" data-tag="${escapeHtml(t)}">#${escapeHtml(t)}</span>`).join(''):''}</div>
                    <h2><a href="#post/${p.id}">${escapeHtml(p.title)}</a></h2>
                    <p class="summary">${escapeHtml(p.summary||'点击阅读全文…')}</p>
                    <span class="read-more">阅读全文</span>
                </article>`).join('');
            postList.querySelectorAll('.post-card').forEach(c => c.addEventListener('click', function(e) {
                if (e.target.closest('a') || e.target.closest('.post-tag')) return;
                navigateToPost(this.dataset.id);
            }));
            postList.querySelectorAll('.post-tag').forEach(el => el.addEventListener('click', function(e) {
                e.stopPropagation(); selectTag(this.dataset.tag);
            }));
            postList.classList.toggle('grid-layout', currentLayout === 'double');
        }

        function renderHome(tag) {
            pageHome.classList.remove('hidden'); pagePost.classList.add('hidden');
            backBtn.classList.remove('visible'); readingProgress.style.width = '0%';
            currentTag = tag || 'all'; renderTags(currentTag); renderPostList(currentTag);
            setHashForTag(currentTag); window.scrollTo({top:0,behavior:'smooth'});
        }

        async function renderPost(postId) {
            const meta = posts.find(p => p.id === postId);
            if (!meta) { postDetail.innerHTML = '文章未找到'; return; }
            postDetail.innerHTML = '<div class="loading-state"><div class="spinner"></div></div>';
            pageHome.classList.add('hidden'); pagePost.classList.remove('hidden'); backBtn.classList.add('visible');
            try {
                const mdUrl = CONFIG.postsDir + meta.filename;
                let mdText = markdownCache.get(mdUrl);
                if (!mdText) { const r = await fetchWithTimeout(mdUrl); mdText = await r.text(); markdownCache.set(mdUrl, mdText); }
                const htmlContent = marked.parse(mdText);
                postDetail.innerHTML = `<h1>${escapeHtml(meta.title)}</h1><div class="post-content">${htmlContent}</div>`;
                if (typeof hljs !== 'undefined') document.querySelectorAll('pre code').forEach(b => hljs.highlightElement(b));
                currentPostId = postId; setHashForPost(postId); window.scrollTo({top:0,behavior:'smooth'});
            } catch(e) { postDetail.innerHTML = `<div class="error-state">加载失败</div>`; }
        }

        function navigateToPost(id) { if(isLoading) return; isLoading = true; renderPost(id).finally(() => isLoading = false); }
        function navigateHome(tag) { if(isLoading) return; isLoading = true; renderHome(tag||currentTag||'all'); requestAnimationFrame(() => isLoading = false); }
        function selectTag(tag) { if(tag === currentTag && !pageHome.classList.contains('hidden')) return; renderHome(tag); }
        function handleRoute() {
            const pid = getPostIdFromHash();
            if (pid) { if (!posts.length) loadIndex().then(() => navigateToPost(pid)); else navigateToPost(pid); return; }
            const tag = getTagFromHash() || 'all';
            if (!posts.length) loadIndex().then(() => renderHome(tag)); else renderHome(tag);
        }

        backBtn.addEventListener('click', () => navigateHome('all'));
        headerBrand.addEventListener('click', () => navigateHome('all'));
        window.addEventListener('hashchange', handleRoute);
        window.addEventListener('scroll', debounce(() => {
            const st = window.pageYOffset;
            if (!pagePost.classList.contains('hidden')) {
                const dh = document.documentElement.scrollHeight - window.innerHeight;
                if (dh > 0) readingProgress.style.width = Math.min((st/dh)*100, 100) + '%';
            }
            backToTop.classList.toggle('visible', st > CONFIG.scrollThreshold);
            header.classList.toggle('scrolled', st > 10);
        }, 50), {passive: true});
        backToTop.addEventListener('click', () => window.scrollTo({top:0,behavior:'smooth'}));
        window.addEventListener('resize', debounce(() => {
            if (!localStorage.getItem('blog-layout')) {
                const pref = window.innerWidth >= 768 ? 'double' : 'single';
                if (pref !== currentLayout && !pageHome.classList.contains('hidden')) setLayout(pref);
            }
        }, 300));

        async function init() {
            try { await loadIndex(); } catch(e){}
            const layout = getPreferredLayout(); currentLayout = layout;
            handleRoute();
            requestAnimationFrame(() => { postList.classList.toggle('grid-layout', layout === 'double'); renderLayoutToggle(); });
        }
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
        else init();
    })();
    </script>
</body>
</html>
